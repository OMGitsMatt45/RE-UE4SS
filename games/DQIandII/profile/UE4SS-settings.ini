; DQIandII core 0.1.0: upstream 3.0.1-1181-g83330635, Steam 1.0.2.
; Start with III's conservative profile: keep its problematic LoadMap detour off.
; I & II startup isolation also requires HookInitGameState = 0.
[General]
EnableHotReloadSystem = 0
UseCache = 0
SecondsToScanBeforeGivingUp = 30
bUseUObjectArrayCache = true

[Debug]
ConsoleEnabled = 0
GuiConsoleEnabled = 0
GuiConsoleVisible = 0

[Hooks]
HookLoadMap = 0
HookProcessInternal = 1
HookProcessLocalScriptFunction = 1
HookInitGameState = 0
HookCallFunctionByNameWithArguments = 1
HookBeginPlay = 1
HookLocalPlayerExec = 1

[CrashDump]
EnableDumping = 1
FullMemoryDump = 0
